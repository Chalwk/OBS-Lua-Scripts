name: Bug Report
description: Report a bug or unexpected behaviour in one of the OBS Lua scripts.
title: "[BUG] <title>"
labels: [ "bug", "needs triage" ]
assignees: Chalwk
body:
  - type: markdown
    attributes:
      value: |
        **Is this a security issue?**

        If this bug could expose stream keys, leak credentials, or let an
        attacker do something they shouldn't, **do not open a public issue**.
        Use the [Report a vulnerability](https://github.com/Chalwk/OBS-Lua-Scripts/security/advisories/new)
        link on the Security tab instead.

        For all other bugs, continue below.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest version of this script.
          required: true

  - type: input
    id: script
    attributes:
      label: Which Script?
      description: Provide the filename of the script that is misbehaving.
      placeholder: "e.g., focus_standby.lua"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the exact steps that trigger the problem.
      placeholder: |
        1. Add the script to OBS
        2. Configure the property ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
      placeholder: "Explain the expected behavior"
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Describe what actually happened.
      placeholder: "Explain what happened instead"
    validations:
      required: true

  - type: textarea
    id: script-log
    attributes:
      label: OBS Script Log Output
      description: |
        Paste any errors from the OBS script log.
        In OBS: **Tools → Script Log**, or check **Help → Log Files → View Current Log**.
      placeholder: "Paste the full error output here"
      render: text
    validations:
      required: false

  - type: input
    id: obs-version
    attributes:
      label: OBS Studio Version
      description: Which version of OBS Studio are you running?
      placeholder: "e.g., 30.1.2"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which OS are you running?
      placeholder: "e.g., Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or notes.
      placeholder: "Further context or information here"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        Thanks for taking the time to report this. Before posting, please
        redact any API keys, tokens, or personal data from logs and screenshots.